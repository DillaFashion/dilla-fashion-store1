<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dilla Fashion Store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-pink-600 text-white py-5 text-center">
    <h1 class="text-3xl font-bold">Dilla Fashion Store</h1>
    <p class="text-sm">Shop your favorite styles directly from Telegram or WhatsApp!</p>
  </header>

  <main class="max-w-5xl mx-auto p-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="product-grid"></div>
  </main>

  <footer class="text-center py-4 bg-gray-100">
    <p>© 2025 Dilla Fashion Store | 
      <a href="https://t.me/DillaFashionBot" class="text-blue-600">Telegram</a> | 
      <a href="https://wa.me/251900868540" class="text-green-600">WhatsApp</a>
    </p>
  </footer>

  <script>
    const products = [
      { id: 1, name: "Men’s Classic T-Shirt", price: "450 ETB", image: "https://via.placeholder.com/300x200?text=T-Shirt" },
      { id: 2, name: "Ladies Dress", price: "750 ETB", image: "https://via.placeholder.com/300x200?text=Dress" },
      { id: 3, name: "Kids Shorts", price: "300 ETB", image: "https://via.placeholder.com/300x200?text=Shorts" }
    ];

    const grid = document.getElementById('product-grid');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = "bg-white shadow-md rounded-lg overflow-hidden text-center";
      card.innerHTML = `
        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover" />
        <div class="p-4">
          <h2 class="font-semibold text-lg">${p.name}</h2>
          <p class="text-pink-600 font-bold">${p.price}</p>
          <div class="mt-2 flex justify-center gap-3">
            <a href="https://t.me/DillaFashionBot" target="_blank" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">View on Telegram</a>
            <a href="https://wa.me/251900868540" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">WhatsApp</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
