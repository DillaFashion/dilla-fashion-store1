<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dilla Fashion Store</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { background-color: #CFF4D2; font-family: Arial, sans-serif; margin:0; padding:0; }
    header { background-color: #004E9A; color: white; padding: 15px; text-align: center; }
    .products { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; gap: 20px; }
    .product { background: white; padding: 15px; border-radius: 10px; width: 250px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    .product h3 { margin: 5px 0; }
    .product p { margin: 5px 0; }
    .price { color: #1F2F98; font-weight: bold; }
    .likes { color: #8B4C70; font-weight: bold; cursor: pointer; float: right; }
    .buttons { margin-top: 10px; display: flex; justify-content: space-between; }
    .buttons a { text-decoration: none; color: white; padding: 5px 10px; border-radius: 5px; }
    .telegram { background-color: #0088cc; }
    .whatsapp { background-color: #25D366; }
    #map { height: 300px; margin: 20px; border-radius: 10px; }
    .sort { margin: 20px; text-align: center; }
    .sort select { padding: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Dilla Fashion Store</h1>
    <p>Chat directly with us on Telegram or WhatsApp</p>
  </header>

  <div class="sort">
    Sort by:
    <select id="sortSelect">
      <option value="price">Price</option>
      <option value="likes">Popularity</option>
      <option value="id">Newest</option>
    </select>
  </div>

  <div class="products" id="productsContainer"></div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
