<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dilla Fashion</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        text-align: center;
        padding: 1rem;
      }
      #map {
        height: 400px;
        border-radius: 15px;
        margin: 20px auto;
        width: 90%;
      }
      .btn {
        background: #222;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>👗 Dilla Fashion</h1>
    <p>Welcome to our online store! Chat directly with us on Telegram.</p>

    <a class="btn" href="https://t.me/dilla_fashion_bot">💬 Chat on Telegram</a>

    <div id="map"></div>

    <script>
      const map = L.map("map").setView([6.4101, 38.3102], 14); // Dilla coordinates
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      L.marker([6.4101, 38.3102])
        .addTo(map)
        .bindPopup("Dilla Fashion Store<br>Visit us in Dilla City.")
        .openPopup();
    </script>
  </body>
</html>
